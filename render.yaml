services:
  - type: web
    name: jarvis-phone
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: JARVIS_PHONE_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL
        sync: false
      - key: ELEVENLABS_SPEED
        sync: false
      - key: OPENAI_CHAT_MODEL
        sync: false
      - key: PC_JARVIS_URL
        sync: false
      - key: PC_LAUNCHER_URL
        sync: false
