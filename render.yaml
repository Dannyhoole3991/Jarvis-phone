services:
  - type: web
    name: jarvis-phone
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Two things found live testing a real delegated task:
    # 1) gunicorn's default 30s worker timeout is shorter than
    #    run_on_pc's own 45s wait for the PC to reply -- fixed with
    #    --timeout 90.
    # 2) gunicorn's default is ONE sync worker handling one request at
    #    a time. While /api/message blocks in run_on_pc waiting for the
    #    PC, that same (only) worker can't also handle the PC's
    #    incoming /api/pc_poll request that would deliver the reply --
    #    a self-deadlock. --threads makes the single worker handle
    #    several requests concurrently via threads, which is safe here
    #    since state.json access is already guarded by _state_lock.
    startCommand: gunicorn app:app --timeout 90 --workers 1 --threads 8 --worker-class gthread
    # Only the three secrets need a value here -- everything else
    # (voice id/model/speed, chat model, and the PC's Tailscale URLs)
    # already has a working default baked into app.py, so leaving them
    # unset on Render just uses those defaults.
    envVars:
      - key: JARVIS_PHONE_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
