<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jarvis Mirror</title>
<style>
  :root{
    --cyan: #34e5ff;
    --red: #ff6a6a;
    --text: #eafcff;
    --text-dim: rgba(220, 240, 255, 0.6);
  }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    background:#000; color:var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    overflow:hidden;
  }
  input { user-select:text; }

  .wrap {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing:border-box;
  }

  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid rgba(120,200,255,0.18); flex-shrink:0;
  }
  .header-title { font-size:13px; letter-spacing:0.5px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  .header-title .dot { width:7px; height:7px; border-radius:50%; background:#35e08a; box-shadow:0 0 5px #35e08a; }
  .header-btns { display:flex; gap:8px; }
  .header-btns button {
    background: rgba(255,255,255,0.06); border:1px solid rgba(120,200,255,0.25); color:var(--text-dim);
    border-radius:8px; padding:5px 10px; font-size:11.5px; cursor:pointer;
  }
  .header-btns button.danger { background: rgba(255,106,106,0.14); border-color: rgba(255,106,106,0.35); color:var(--red); }

  .log {
    flex:1; overflow-y:auto; padding:14px; font-size:13.5px; line-height:1.55;
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    white-space:pre-wrap; word-break:break-word;
  }
  .line { margin-bottom:12px; color:var(--text); }
  .line.user { color:var(--cyan); }
  .line.tool { color:var(--text-dim); font-style:italic; }
  .empty-hint { color:var(--text-dim); font-size:13px; text-align:center; margin-top:30px; padding:0 20px; line-height:1.5; }

  .input-row {
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    border-top:1px solid rgba(120,200,255,0.18); flex-shrink:0;
  }
  .input-row input {
    flex:1; background: rgba(255,255,255,0.06); border:1px solid rgba(120,200,255,0.22);
    border-radius:20px; padding:11px 16px; color:var(--text); font-size:14.5px; outline:none; min-width:0;
  }
  .input-row input::placeholder { color: rgba(220,240,255,0.4); }
  .send-btn {
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(52,229,255,0.16); border:1px solid rgba(120,200,255,0.3);
    color: var(--cyan); cursor:pointer; font-size:15px;
  }

  .toast {
    position:absolute; bottom:calc(70px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(6px);
    background: rgba(20,20,20,0.9); border:1px solid rgba(120,200,255,0.3); border-radius:10px;
    padding:8px 16px; font-size:12.5px; color:var(--text); opacity:0; pointer-events:none;
    transition: all 0.25s ease; white-space:nowrap; max-width: 85vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-title"><span class="dot"></span>Jarvis Mirror</div>
    <div class="header-btns">
      <button id="resetBtn">New conversation</button>
      <button id="backBtn" class="danger">Back</button>
    </div>
  </div>
  <div class="log" id="log">
    <div class="empty-hint" id="emptyHint">
      This is a live mirror of the actual conversation used to build and repair Jarvis --
      independent of the PC engine, so it still works while Jarvis is being fixed or restarted.
      Type below to continue it.
    </div>
  </div>
  <div class="input-row">
    <input id="textInput" type="text" placeholder="Message Claude..." autocapitalize="off" />
    <div class="send-btn" id="sendBtn" title="Send">&#10148;</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function getSecret() { return localStorage.getItem("jarvisPhoneSecret") || ""; }

const logEl = document.getElementById("log");
const emptyHint = document.getElementById("emptyHint");
const textInput = document.getElementById("textInput");
const toastEl = document.getElementById("toast");

let toastTimer = null;
function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
}

function appendLine(text) {
  if (emptyHint) emptyHint.remove();
  const line = document.createElement("div");
  line.className = "line";
  if (text.startsWith("[working:")) line.classList.add("tool");
  line.textContent = text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function appendMine(text) {
  if (emptyHint) emptyHint.remove();
  const line = document.createElement("div");
  line.className = "line user";
  line.textContent = "> " + text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

// Persisted per-browser so reopening this page later (not hitting "New
// conversation") still only picks up what's new, not the whole backlog.
let lastEventId = localStorage.getItem("jarvisMirrorLastEventId") || "";

async function pollEvents() {
  try {
    const res = await fetch("/api/mirror_events?since=" + encodeURIComponent(lastEventId), {
      headers: { "Authorization": "Bearer " + getSecret() },
    });
    const data = await res.json();
    if (data.last_id) {
      lastEventId = data.last_id;
      localStorage.setItem("jarvisMirrorLastEventId", lastEventId);
    }
    for (const event of (data.events || [])) {
      appendLine(event.text);
    }
  } catch (err) {
    // Try again next tick.
  }
}
setInterval(pollEvents, 2000);
pollEvents();

async function sendMessage() {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = "";
  appendMine(text);
  try {
    await fetch("/api/mirror_message", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getSecret() },
      body: JSON.stringify({ text }),
    });
  } catch (err) {
    showToast("Couldn't reach the launcher on the PC.");
  }
}
document.getElementById("sendBtn").addEventListener("click", sendMessage);
textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (!confirm("Start a fresh conversation? This won't continue from where the current one left off.")) return;
  try {
    await fetch("/api/mirror_reset", {
      method: "POST",
      headers: { "Authorization": "Bearer " + getSecret() },
    });
    logEl.innerHTML = "";
    lastEventId = "";
    localStorage.setItem("jarvisMirrorLastEventId", "");
    showToast("Starting fresh, sir.");
  } catch (err) {
    showToast("Couldn't reach the phone backend.");
  }
});

document.getElementById("backBtn").addEventListener("click", () => {
  window.location.href = "/";
});
</script>
</body>
</html>
