<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jarvis</title>

<!-- Installable as a proper full-screen app from the iOS Share Sheet
     ("Add to Home Screen") -- apple-mobile-web-app-capable is what iOS
     actually keys off for that, not manifest.json (that one matters
     more for Android/Chrome, included for parity/future-proofing). No
     service worker on purpose: this app is inherently live/online
     (real-time voice, TTS, PC relay), so an offline cache would just be
     a source of stale-state bugs for no real benefit. -->
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Jarvis" />
<meta name="theme-color" content="#000000" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="icon" href="/icon-192.png" />
<style>
  :root{
    --cyan: #ffb347;
    --blue: #ff8c3d;
    --purple: #ff8c3d;
    --red: #ff6a6a;
    --text: #fff3e0;
    --text-dim: rgba(255, 230, 200, 0.6);
  }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    background: #000;
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  input { user-select: text; }

  .wrap {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px;
    padding: 0 20px;
    box-sizing: border-box;
  }
  .wrap[hidden] { display:none; }

  .settings-btn {
    position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px;
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); font-size:14px; background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,190,130,0.2); z-index:5;
  }

  .pc-status {
    position:absolute; top:calc(20px + env(safe-area-inset-top)); left:16px;
    font-size:11px; color: var(--text-dim); display:flex; align-items:center; gap:6px; z-index:5;
  }
  .pc-status .dot { width:7px; height:7px; border-radius:50%; background: rgba(255,255,255,0.25); }
  .pc-status.online .dot { background: #35e08a; box-shadow: 0 0 5px #35e08a; }
  .start-pc-btn {
    margin-left:4px; font-size:10.5px; color: var(--cyan); background: rgba(255,179,71,0.12);
    border:1px solid rgba(255,190,130,0.3); border-radius:8px; padding:2px 8px; cursor:pointer;
  }
  .start-pc-btn[hidden] { display:none; }
  .start-pc-btn.busy { opacity:0.5; pointer-events:none; }

  /* ---------- The orb: a rotating holographic wireframe globe on
     canvas, same design as the desktop HUD -- gold/amber, deliberately
     not blue. ---------- */
  #orbCanvas { display:block; }

  .status-text {
    font-size:13px; letter-spacing:0.5px; color: var(--text-dim);
    min-height:18px; text-align:center;
  }

  /* ---------- Input + controls ---------- */
  .input-row {
    width:100%; max-width:360px;
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,190,130,0.22);
    border-radius:24px;
    padding: 6px 6px 6px 18px;
  }
  .input-row input {
    flex:1; background:transparent; border:none; outline:none;
    color: var(--text); font-size:16px; padding:10px 4px;
    min-width: 0;
  }
  .input-row input::placeholder { color: rgba(255,230,200,0.4); }
  .round-btn {
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,179,71,0.16); border:1px solid rgba(255,190,130,0.3);
    color: var(--cyan); cursor:pointer; font-size:15px;
  }
  .round-btn.mic.active {
    background: rgba(255,106,106,0.22); border-color: rgba(255,106,106,0.5); color: var(--red);
  }
  .round-btn.stop {
    background: rgba(255,106,106,0.14); border-color: rgba(255,106,106,0.35); color: var(--red);
  }

  .control-row { display:flex; gap:14px; align-items:center; }

  .orb-area {
    display:flex; flex-direction:column; align-items:center; gap:26px;
  }

  /* Window mode: a full chat log with message history, same idea and
     layout as the desktop HUD's toggle -- pure CSS visibility swap over
     the same persistent state, so switching back never loses anything. */
  .chat-log {
    display:none;
    width:100%; max-width:360px; flex:1; min-height:0;
    overflow-y:auto;
    border:1px solid rgba(255,190,130,0.22);
    border-radius:14px;
    padding:14px;
    box-sizing:border-box;
    background: rgba(255,255,255,0.04);
  }
  body.window-mode .orb-area { display:none; }
  body.window-mode .chat-log { display:block; }
  body.window-mode .wrap { padding-top:calc(56px + env(safe-area-inset-top)); }

  .chat-msg { margin-bottom:14px; max-width:85%; }
  .chat-msg.chat-user { margin-left:auto; text-align:right; }
  .chat-msg.chat-jarvis { margin-right:auto; text-align:left; }
  .chat-text {
    display:inline-block; padding:8px 14px; border-radius:14px;
    font-size:14px; line-height:1.4; white-space:pre-wrap; text-align:left;
  }
  .chat-user .chat-text { background: rgba(255,179,71,0.18); color: var(--cyan); }
  .chat-jarvis .chat-text { background: rgba(255,255,255,0.08); color: var(--text); }

  .toast {
    position:absolute; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(6px);
    background: rgba(20,20,20,0.9); border:1px solid rgba(255,190,130,0.3); border-radius:10px;
    padding:8px 16px; font-size:12.5px; color:var(--text); opacity:0; pointer-events:none;
    transition: all 0.25s ease; white-space:nowrap; max-width: 85vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .setup-overlay {
    position:fixed; inset:0; background:#000; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding: 0 30px;
  }
  .setup-overlay[hidden] { display: none; }
  .setup-overlay input {
    width:100%; max-width:320px; background: rgba(255,255,255,0.08); border:1px solid rgba(255,190,130,0.3);
    border-radius:10px; padding:12px 14px; color:var(--text); font-size:16px; outline:none;
  }
  .setup-overlay button {
    background: rgba(255,179,71,0.18); border:1px solid rgba(255,190,130,0.3); border-radius:10px;
    padding:10px 20px; color:var(--text); font-size:14px; cursor:pointer;
  }
  .setup-overlay p { color: var(--text-dim); font-size:13px; text-align:center; max-width:300px; }

  /* ---------- Tabs: Chat (quick brain), PC (the PC's own Jarvis), and
     read-only copies of the desktop dashboard. ---------- */
  .tabs {
    position:absolute; top:calc(48px + env(safe-area-inset-top)); left:0; right:0; z-index:6;
    display:flex; gap:6px; overflow-x:auto; padding:0 12px 6px; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    flex-shrink:0; font-size:13px; padding:7px 13px; border-radius:16px; color:var(--text-dim);
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,190,130,0.15); position:relative;
  }
  .tab.on { color:#000; background:var(--cyan); border-color:var(--cyan); font-weight:600; }
  .tab .badge {
    position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; border-radius:8px; padding:0 4px;
    background:var(--red); color:#fff; font-size:10px; line-height:16px; text-align:center; box-sizing:border-box;
  }
  .tab .badge[hidden] { display:none; }
  .wrap { padding-top:calc(96px + env(safe-area-inset-top)); }
  body.window-mode .wrap { padding-top:calc(100px + env(safe-area-inset-top)); }
  body.info-tab .wrap { display:none; }
  .info {
    display:none; position:absolute; top:calc(96px + env(safe-area-inset-top)); left:0; right:0; bottom:0;
    overflow-y:auto; padding:6px 14px calc(24px + env(safe-area-inset-bottom)); box-sizing:border-box;
    -webkit-user-select:text; user-select:text;
  }
  body.info-tab .info { display:block; }
  .info-head { font-size:11.5px; color:var(--text-dim); margin:2px 2px 10px; }
  .card {
    background:rgba(255,255,255,0.045); border:1px solid rgba(255,190,130,0.16); border-radius:14px;
    padding:12px 14px; margin-bottom:12px;
  }
  .card h3 { margin:0 0 8px; font-size:12px; font-weight:600; letter-spacing:0.6px; text-transform:uppercase; color:var(--cyan); }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .tile { background:rgba(255,255,255,0.045); border:1px solid rgba(255,190,130,0.16); border-radius:12px; padding:10px 12px; }
  .tile .k { font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .tile .v { font-size:20px; font-weight:600; margin-top:2px; }
  .tile .n { font-size:11px; color:var(--text-dim); margin-top:2px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid rgba(255,190,130,0.08); font-size:13.5px; }
  .row:first-of-type { border-top:none; }
  .row .l { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .row .r { flex-shrink:0; color:var(--text-dim); text-align:right; }
  .sub { color:var(--text-dim); font-size:12px; }
  .good { color:#35e08a; } .bad { color:var(--red); }
  .bar { height:7px; border-radius:4px; background:rgba(255,255,255,0.08); margin:6px 0 10px; overflow:hidden; }
  .bar > div { height:100%; background:var(--cyan); }
  .bar.hot > div { background:var(--red); }
  .md { font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
  .pay-card { border-color:rgba(53,224,138,0.5); }
  .ask-card { border-color:rgba(255,190,130,0.6); }
  .pay-btns { display:flex; gap:10px; margin-top:10px; }
  .pay-btns button { flex:1; font-size:15px; padding:11px 0; border-radius:10px; border:1px solid rgba(255,190,130,0.3);
    background:rgba(255,255,255,0.06); color:var(--text); }
  .pay-btns button.go { background:#1f9d5c; border-color:#35e08a; color:#fff; font-weight:600; }
  .pay-btns button:disabled { opacity:0.5; }
  .pc-line { font-size:12.5px; color:var(--text-dim); text-align:center; max-width:320px; min-height:16px; }
  /* Each tab keeps its own conversation. */
  #pcLog { display:none; }
  body.window-mode.tab-pc #chatLog { display:none; }
  body.window-mode.tab-pc #pcLog { display:block; }
</style>
</head>
<body>

<div class="setup-overlay" id="setupOverlay" hidden>
  <p>Enter the access key for this Jarvis connection.</p>
  <input id="secretInput" type="password" placeholder="Access key" autocapitalize="off" autocorrect="off" />
  <button id="secretSaveBtn">Connect</button>
</div>

<div class="wrap">
  <div class="settings-btn" id="settingsBtn" title="Change access key">&#9881;</div>
  <div class="pc-status" id="pcStatus"><span class="dot"></span><span id="pcStatusText">Main PC offline</span><button class="start-pc-btn" id="startPcBtn" hidden>Start Jarvis</button></div>

  <div class="orb-area" id="orbArea">
    <canvas id="orbCanvas" width="220" height="220"></canvas>
    <div class="status-text" id="statusText">Tap the mic, or type below</div>
    <div class="pc-line" id="pcLine"></div>
  </div>

  <div class="chat-log" id="chatLog"></div>
  <div class="chat-log" id="pcLog"></div>

  <div class="input-row">
    <input id="textInput" type="text" placeholder="Type to Jarvis..." />
    <div class="round-btn" id="sendBtn" title="Send">&#10148;</div>
  </div>

  <div class="control-row">
    <div class="round-btn mic" id="micBtn" title="Hold to talk">&#127908;</div>
    <div class="round-btn stop" id="stopBtn" title="Stop">&#9632;</div>
    <div class="round-btn" id="modeToggleBtn" title="Switch to window view">&#9635;</div>
  </div>
</div>

<nav class="tabs" id="tabs">
  <div class="tab" data-tab="chat">Chat</div>
  <div class="tab" data-tab="pc">PC<span class="badge" id="pcBadge" hidden></span></div>
  <div class="tab" data-tab="money">Money</div>
  <div class="tab" data-tab="store">Store</div>
  <div class="tab" data-tab="ads">Ads</div>
  <div class="tab" data-tab="business">Business</div>
  <div class="tab" data-tab="trading">Trading</div>
  <div class="tab" data-tab="usage">Usage</div>
  <div class="tab" data-tab="needs">Needs you</div>
</nav>

<div class="info" id="info">
  <div class="info-head" id="infoHead"></div>
  <div id="infoBody"></div>
</div>

<div class="toast" id="toast"></div>

<audio id="player" hidden></audio>

<script>
const statusText = document.getElementById("statusText");
const player = document.getElementById("player");

// ---- Audio. iPhones only let a web page start sound right after a tap, and the
// PC's answers arrive seconds later, so playing them through the <audio> tag
// was silently refused (confirmed live 2026-10-15: the PC's reply reached the
// phone server but was never heard). Web Audio, unlocked by the first tap,
// stays allowed for the rest of the session. <audio> is the fallback. ----
let audioCtx = null;
let currentSource = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state !== "running") audioCtx.resume();
    const silence = audioCtx.createBufferSource();          // iOS wants a sound started inside the tap
    silence.buffer = audioCtx.createBuffer(1, 1, 22050);
    silence.connect(audioCtx.destination);
    silence.start(0);
  } catch (err) {}
}
document.addEventListener("touchend", unlockAudio, { passive: true });
document.addEventListener("click", unlockAudio);

function base64ToBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
// Plays a "data:audio/...;base64,..." clip; resolves when it ends, is stopped, or can't play.
function playAudio(dataUri) {
  return new Promise(async (resolve) => {
    if (audioCtx && audioCtx.state === "running") {
      try {
        const buffer = await audioCtx.decodeAudioData(base64ToBuffer(dataUri.split(",")[1]));
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.onended = () => { if (currentSource === source) currentSource = null; resolve(); };
        currentSource = source;
        source.start(0);
        return;
      } catch (err) {}
    }
    player.src = dataUri;
    player.onended = resolve;
    player.play().catch(resolve);
  });
}
function stopAudio() {
  if (currentSource) { try { currentSource.stop(); } catch (err) {} }
  const finish = player.onended;
  player.pause();
  player.currentTime = 0;
  if (finish && !player.ended) finish();
}
const toastEl = document.getElementById("toast");

let toastTimer = null;
function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
}

// ============================================================
// The orb: same rotating holographic wireframe globe as the desktop
// HUD (Jarvis_Desktop_HUD.py / jarvis_hud.html) -- kept in sync
// deliberately, just scaled down and a bit lighter for phone
// performance. Gold/amber, not blue: "too much like Ultron."
// ============================================================
const canvas = document.getElementById("orbCanvas");
const ctx = canvas.getContext("2d");
const SIZE = 220;

// Three nested spheres, same shape/style, alternating spin direction --
// outer clockwise, middle anticlockwise, inner clockwise again. Same
// design as the desktop HUD, just scaled down for phone performance.
const R1 = 76;
const R2 = R1 * 0.70;
const R3 = R1 * 0.40;

let rotY1 = 0, rotX1 = 0.15;
let rotY2 = 0, rotX2 = 0.15;
let rotY3 = 0, rotX3 = 0.15;
let orbState = "idle"; // idle | thinking | speaking | recording

function project(x, y, z) {
  const scale = 180 / (180 - z);
  return { x: SIZE / 2 + x * scale, y: SIZE / 2 + y * scale, scale };
}

function rotateWith(p, rY, rX) {
  let { x, y, z } = p;
  let cosY = Math.cos(rY), sinY = Math.sin(rY);
  let x1 = x * cosY - z * sinY;
  let z1 = x * sinY + z * cosY;
  let cosX = Math.cos(rX), sinX = Math.sin(rX);
  let y1 = y * cosX - z1 * sinX;
  let z2 = y * sinX + z1 * cosX;
  return { x: x1, y: y1, z: z2 };
}
function rotatePoint1(p) { return rotateWith(p, rotY1, rotX1); }
function rotatePoint2(p) { return rotateWith(p, rotY2, rotX2); }
function rotatePoint3(p) { return rotateWith(p, rotY3, rotX3); }

// Not a perfect sphere on purpose -- layered sine waves as a cheap
// stand-in for real 3D noise, so it bulges and dents organically.
// Shared by all three spheres (just a different base radius).
function bulge(ux, uy, uz, radius) {
  const n = Math.sin(ux * 3.4 + uy * 2.1) * 0.5
          + Math.sin(uy * 2.6 - uz * 3.7 + 1.3) * 0.35
          + Math.sin(uz * 4.8 + ux * 1.6 - 0.7) * 0.3
          + Math.sin((ux + uy + uz) * 5.5) * 0.18;
  return radius * (1 + n * 0.16);
}

function buildGrid(radius, meridianCount, parallelCount, segs) {
  const lines = [];
  for (let m = 0; m < meridianCount; m++) {
    const lon = (m / meridianCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.06;
    const pts = [];
    for (let s = 0; s <= segs; s++) {
      const lat = (s / segs) * Math.PI - Math.PI / 2;
      const ux = Math.cos(lat) * Math.cos(lon), uy = Math.sin(lat), uz = Math.cos(lat) * Math.sin(lon);
      const rad = bulge(ux, uy, uz, radius);
      pts.push({ x: rad * ux, y: rad * uy, z: rad * uz });
    }
    lines.push(pts);
  }
  for (let p = 1; p < parallelCount; p++) {
    const lat = (p / parallelCount) * Math.PI - Math.PI / 2 + (Math.random() - 0.5) * 0.03;
    const pts = [];
    for (let s = 0; s <= segs; s++) {
      const lon = (s / segs) * Math.PI * 2;
      const ux = Math.cos(lat) * Math.cos(lon), uy = Math.sin(lat), uz = Math.cos(lat) * Math.sin(lon);
      const rad = bulge(ux, uy, uz, radius);
      pts.push({ x: rad * ux, y: rad * uy, z: rad * uz });
    }
    lines.push(pts);
  }
  return lines;
}

function buildLights(count, radius) {
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < count; i++) {
    const yFrac = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - yFrac * yFrac);
    const theta = golden * i;
    const ux = Math.cos(theta) * radiusAtY, uy = yFrac, uz = Math.sin(theta) * radiusAtY;
    const rad = bulge(ux, uy, uz, radius) * (0.94 + Math.random() * 0.12);
    pts.push({ x: rad * ux, y: rad * uy, z: rad * uz, twinkle: Math.random() * Math.PI * 2 });
  }
  return pts;
}

function buildChaosArcs(count, segs, radius) {
  segs = segs || 40;
  const arcs = [];
  for (let i = 0; i < count; i++) {
    const a1 = Math.random() * Math.PI * 2, a2 = Math.random() * Math.PI - Math.PI / 2;
    const b1 = Math.random() * Math.PI * 2, b2 = Math.random() * Math.PI - Math.PI / 2;
    const start = { x: Math.cos(a2) * Math.cos(a1), y: Math.sin(a2), z: Math.cos(a2) * Math.sin(a1) };
    const end = { x: Math.cos(b2) * Math.cos(b1), y: Math.sin(b2), z: Math.cos(b2) * Math.sin(b1) };
    const pts = [];
    for (let s = 0; s <= segs; s++) {
      const t = s / segs;
      let x = start.x + (end.x - start.x) * t;
      let y = start.y + (end.y - start.y) * t;
      let z = start.z + (end.z - start.z) * t;
      const len = Math.sqrt(x * x + y * y + z * z) || 1;
      const ux = x / len, uy = y / len, uz = z / len;
      const rad = bulge(ux, uy, uz, radius);
      pts.push({ x: rad * ux, y: rad * uy, z: rad * uz });
    }
    arcs.push(pts);
  }
  return arcs;
}

function buildSpokes(count) {
  const spokes = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < count; i++) {
    const yFrac = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - yFrac * yFrac);
    const theta = golden * i + (Math.random() - 0.5) * 0.4;
    const ux = Math.cos(theta) * radiusAtY, uy = yFrac, uz = Math.sin(theta) * radiusAtY;
    const rad = bulge(ux, uy, uz, R1) * (0.9 + Math.random() * 0.2);

    let px = -uz, py = 0, pz = ux;
    const plen = Math.sqrt(px * px + py * py + pz * pz) || 1;
    px /= plen; py /= plen; pz /= plen;
    const qx = uy * pz - uz * py, qy = uz * px - ux * pz, qz = ux * py - uy * px;

    const wobbleAmp = R1 * (0.05 + Math.random() * 0.14);
    const freq = 1 + Math.random() * 2.5;
    const phase1 = Math.random() * Math.PI * 2;
    const phase2 = Math.random() * Math.PI * 2;

    const segs = 16;
    const pts = [];
    for (let s = 0; s <= segs; s++) {
      const t = s / segs;
      const w1 = Math.sin(t * Math.PI * freq + phase1) * wobbleAmp * t;
      const w2 = Math.cos(t * Math.PI * freq + phase2) * wobbleAmp * t * 0.7;
      pts.push({
        x: rad * ux * t + px * w1 + qx * w2,
        y: rad * uy * t + py * w1 + qy * w2,
        z: rad * uz * t + pz * w1 + qz * w2,
      });
    }
    spokes.push(pts);
  }
  return spokes;
}

const gridLines1 = buildGrid(R1, 18, 10, 44);
const lights1 = buildLights(220, R1);
const chaosArcs1 = buildChaosArcs(58, 40, R1);
const spokes = buildSpokes(45);

const gridLines2 = buildGrid(R2, 15, 8, 38);
const lights2 = buildLights(165, R2);
const chaosArcs2 = buildChaosArcs(45, 35, R2);

const gridLines3 = buildGrid(R3, 11, 6, 26);
const lights3 = buildLights(95, R3);
const chaosArcs3 = buildChaosArcs(24, 20, R3);

function colorForState() {
  if (orbState === "recording") return { line: "255,106,106", light: "255,180,180", glow: 20 };
  if (orbState === "thinking") return { line: "255,163,71", light: "255,224,163", glow: 22 };
  if (orbState === "speaking") return { line: "255,140,61", light: "255,200,140", glow: 26 };
  return { line: "255,179,71", light: "255,224,163", glow: 14 };
}

function drawLine(pts, color, baseAlpha, radius, rotateFn) {
  ctx.beginPath();
  let started = false;
  for (const raw of pts) {
    const r = rotateFn(raw);
    if (r.z < -radius * 0.85) { started = false; continue; }
    const proj = project(r.x, r.y, r.z);
    if (!started) { ctx.moveTo(proj.x, proj.y); started = true; }
    else { ctx.lineTo(proj.x, proj.y); }
  }
  ctx.strokeStyle = `rgba(${color},${baseAlpha})`;
  ctx.lineWidth = 0.7;
  ctx.stroke();
}

function drawSpoke(pts, color) {
  const r0 = rotatePoint1(pts[0]);
  const first = project(r0.x, r0.y, r0.z);
  const r1 = rotatePoint1(pts[pts.length - 1]);
  const lastProj = project(r1.x, r1.y, r1.z);
  const grad = ctx.createLinearGradient(first.x, first.y, lastProj.x, lastProj.y);
  grad.addColorStop(0, `rgba(${color},0.55)`);
  grad.addColorStop(1, `rgba(${color},0.02)`);
  ctx.beginPath();
  ctx.moveTo(first.x, first.y);
  ctx.lineTo(lastProj.x, lastProj.y);
  ctx.strokeStyle = grad;
  ctx.lineWidth = 0.8;
  ctx.stroke();
}

function drawLights(lightSet, radius, rotateFn, lightColor) {
  const now = performance.now() / 500;
  for (const p of lightSet) {
    const r = rotateFn(p);
    if (r.z < -radius * 0.4) continue;
    const proj = project(r.x, r.y, r.z);
    const twinkle = 0.5 + 0.5 * Math.sin(now + p.twinkle);
    const depthAlpha = Math.max(0.15, (r.z + radius) / (2 * radius));
    const radiusPx = 0.5 + 0.9 * depthAlpha * twinkle;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, radiusPx, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${lightColor},${(0.35 + 0.5 * twinkle) * depthAlpha})`;
    ctx.shadowColor = `rgba(${lightColor},0.9)`;
    ctx.shadowBlur = 5;
    ctx.fill();
  }
}

function drawOrb() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  const c = colorForState();

  ctx.save();
  ctx.shadowColor = `rgba(${c.line},0.9)`;
  ctx.shadowBlur = c.glow * 0.4;
  for (const line of gridLines1) drawLine(line, c.line, 0.14, R1, rotatePoint1);
  for (const arc of chaosArcs1) drawLine(arc, c.line, 0.055, R1, rotatePoint1);
  for (const spoke of spokes) drawSpoke(spoke, c.line);
  for (const line of gridLines2) drawLine(line, c.line, 0.16, R2, rotatePoint2);
  for (const arc of chaosArcs2) drawLine(arc, c.line, 0.065, R2, rotatePoint2);
  for (const line of gridLines3) drawLine(line, c.line, 0.19, R3, rotatePoint3);
  for (const arc of chaosArcs3) drawLine(arc, c.line, 0.08, R3, rotatePoint3);
  ctx.restore();

  const core = ctx.createRadialGradient(SIZE / 2, SIZE / 2, 3, SIZE / 2, SIZE / 2, R3 * 0.6);
  core.addColorStop(0, `rgba(${c.light},0.35)`);
  core.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = core;
  ctx.fillRect(0, 0, SIZE, SIZE);

  drawLights(lights1, R1, rotatePoint1, c.light);
  drawLights(lights2, R2, rotatePoint2, c.light);
  drawLights(lights3, R3, rotatePoint3, c.light);

  const speed = orbState === "thinking" ? 0.014 : orbState === "recording" ? 0.011 : orbState === "speaking" ? 0.009 : 0.004;

  // Outer: clockwise. Middle: anticlockwise. Inner: clockwise again.
  rotY1 += speed;
  rotX1 = 0.15 + Math.sin(performance.now() / 4000) * 0.05;

  rotY2 -= speed * 1.1;
  rotX2 = 0.15 + Math.cos(performance.now() / 3600) * 0.055;

  rotY3 += speed * 1.35;
  rotX3 = 0.15 + Math.sin(performance.now() / 3000) * 0.06;

  requestAnimationFrame(drawOrb);
}
requestAnimationFrame(drawOrb);

// Safety net on top of the play()-rejection fix above: never trust an
// audio 'ended' event (or anything else) to definitely clear "speaking"

let _speakingWatchdog = null;

function setState(state) {
  orbState = state || "idle";
  const labels = {
    thinking: "Thinking...",

    _speakingWatchdog = null;
  }

    _speakingWatchdog = setTimeout(() => {

  }
}

// ---- PC events: anything Jarvis says on the PC on its own (self-repair
// progress, reassurance check-ins, routine completions) -- not just
// replies to messages this phone sent. Queued and played one at a time,
// never interrupting whatever the phone itself is already doing. ----
// Events wait for the phone's own speech or recording, and for a Chat reply
// in flight -- but NOT for the PC tab's "waiting on the PC" state: hearing the
// PC's progress during that wait is the whole point.
let chatInFlight = false;
function eventsMustWait() {
  return orbState === "speaking" || orbState === "recording" || chatInFlight;
}

let lastEventId = localStorage.getItem("jarvisLastEventId") || "";
let firstEventPoll = !lastEventId;   // a brand-new phone shows recent history but doesn't read it all out
const pcEventQueue = [];
let drainingQueue = false;

async function pollPcEvents() {
  try {
    const res = await fetch("/api/pc_events?since=" + encodeURIComponent(lastEventId), {
      headers: { "Authorization": "Bearer " + getSecret() },
    });
    const data = await res.json();
    if (data.last_id) {
      lastEventId = data.last_id;
      localStorage.setItem("jarvisLastEventId", lastEventId);
    }
    const events = data.events || [];
    if (firstEventPoll) {
      firstEventPoll = false;
      events.slice(-6).forEach((e) => appendChatMessage("jarvis", e.text, "pc"));
      return;
    }
    for (const event of events) {
      // Everything the PC says lands in the PC tab's conversation. It's only
      // spoken while that tab is open; elsewhere the tab gets a badge instead.
      appendChatMessage("jarvis", event.text, "pc");
      heardFromPc(event.text);
      if (currentTab === "pc") pcEventQueue.push(event.text);
      else bumpPcBadge();
    }
    drainPcEventQueue();
  } catch (err) {
    // Offline or PC not reachable -- just try again next tick.
  }
}

async function drainPcEventQueue() {
  if (drainingQueue) return;
  drainingQueue = true;
  try {
    while (pcEventQueue.length > 0) {
      while (eventsMustWait()) {
        await new Promise((r) => setTimeout(r, 300));
      }
      const text = pcEventQueue.shift();
      await speakPcEvent(text);
    }
  } finally {
    drainingQueue = false;
  }
}

async function speakPcEvent(text) {
  setState("speaking");
  try {
    const res = await fetch("/api/speak_text", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getSecret() },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (data.audio_base64) {
      await playAudio("data:" + data.audio_mime + ";base64," + data.audio_base64);
    }
  } catch (err) {
    // Skip this one and move on rather than getting the queue stuck.
  }
  afterSpeaking();
}

// Faster while the PC tab is open or a PC job is running: that's when the gap is heard.
(function eventLoop() {
  pollPcEvents().finally(() => setTimeout(eventLoop, (currentTab === "pc" || pcJob) ? 1000 : 4000));
})();

// ---- PC jobs: one request from the PC tab, from "sent" until the PC says it's done ----
let pcJob = null;   // { id, lastHeard, fillers, done }
const pcLine = document.getElementById("pcLine");

function setPcWaiting() {
  setState("thinking");
  statusText.textContent = "Your PC is working on it...";
}
function afterSpeaking() {
  if (pcJob && !pcJob.done) setPcWaiting();
  else setState(null);
}
function heardFromPc(text) {
  if (pcJob) pcJob.lastHeard = Date.now();
  pcLine.textContent = currentTab === "pc" ? "PC: " + (text.length > 90 ? text.slice(0, 88) + "..." : text) : "";
}
function startPcJob(id) {
  pcJob = { id, lastHeard: Date.now(), fillers: 0, done: false };
  if (orbState !== "speaking") setPcWaiting();
}

setInterval(async () => {
  if (!pcJob) return;
  if (!pcJob.done) {
    try {
      const res = await fetch("/api/pc_job/" + pcJob.id, { headers: { "Authorization": "Bearer " + getSecret() } });
      const data = await res.json();
      if (data.done) pcJob.done = true;
    } catch (err) {}
  }
  if (pcJob.done) {
    // Finished: let its last words play out, then settle.
    if (!pcEventQueue.length && !drainingQueue && orbState !== "speaking") {
      pcJob = null;
      setState(null);
    }
    return;
  }
  // No word from the PC for 20 seconds: say so, rather than leave dead air (at most 3 times).
  if (Date.now() - pcJob.lastHeard > 20000 && pcJob.fillers < 3 && currentTab === "pc" && !eventsMustWait() && !drainingQueue) {
    pcJob.fillers += 1;
    pcJob.lastHeard = Date.now();
    await playClip("wait");
  }
}, 2000);

// ---- Short fixed lines, made once and kept, so they play the instant you send ----
const CLIPS = { send: "Sending that to your PC, sir.", wait: "Still working on it, sir." };
const clipAudio = {};
async function loadClips() {
  if (!getSecret()) return;
  for (const [name, text] of Object.entries(CLIPS)) {
    const key = "jarvisClip:" + text;
    try {
      const cached = localStorage.getItem(key);
      if (cached) { clipAudio[name] = cached; continue; }
    } catch (err) {}
    try {
      const res = await fetch("/api/speak_text", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getSecret() },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();
      if (data.audio_base64) {
        clipAudio[name] = "data:" + data.audio_mime + ";base64," + data.audio_base64;
        try { localStorage.setItem(key, clipAudio[name]); } catch (err) {}
      }
    } catch (err) {}
  }
}
function playClip(name) {
  const src = clipAudio[name];
  if (!src) return Promise.resolve();
  setState("speaking");
  return playAudio(src).then(afterSpeaking);
}
loadClips();

// ---- Sending messages: the Chat tab asks the quick brain; the PC tab hands
// the request to the PC and then hears its progress and answer as they come. ----
async function sendText(text) {
  if (!text.trim()) return;
  const mode = currentTab === "pc" ? "pc" : "chat";
  if (mode === "pc") {
    appendChatMessage("user", text, "pc");
    playClip("send");                    // instant, while the request goes up
  } else {
    setState("thinking");
    chatInFlight = true;
  }
  try {
    const res = await fetch("/api/message", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getSecret() },
      body: JSON.stringify({ text, mode }),
    });
    await handleResponse(res, mode, true);
  } catch (err) {
    showToast("Couldn't reach Jarvis.");
    chatInFlight = false;
    afterSpeaking();
  }
}

async function sendAudio(blob) {
  const mode = currentTab === "pc" ? "pc" : "chat";
  if (mode === "chat") { setState("thinking"); chatInFlight = true; }
  else if (orbState !== "speaking") setPcWaiting();   // don't cut off "Sending that to your PC"
  try {
    const form = new FormData();
    form.append("audio", blob, "voice.webm");
    form.append("mode", mode);
    const res = await fetch("/api/message", {
      method: "POST",
      headers: { "Authorization": "Bearer " + getSecret() },
      body: form,
    });
    await handleResponse(res, mode, false);
  } catch (err) {
    showToast("Couldn't reach Jarvis.");
    chatInFlight = false;
    afterSpeaking();
  }
}

async function handleResponse(res, mode, typed) {
  chatInFlight = false;
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    showToast(data.error || "Something went wrong.");
    afterSpeaking();
    return;
  }
  const data = await res.json();
  if (data.open_mirror) {
    // A request to fix/rebuild Jarvis -- that's a separate page
    // (mirror.html), a live mirror of the actual dev conversation with
    // Claude, independent of this app and the PC engine's health.
    setState(null);
    window.location.href = "/mirror.html";
    return;
  }
  if (mode === "pc") {
    if (!typed && data.transcribed_text) appendChatMessage("user", data.transcribed_text, "pc");
    if (data.queued) { startPcJob(data.queued); return; }
    if (data.reply) {                    // e.g. the PC is offline
      appendChatMessage("jarvis", data.reply, "pc");
      await speakPcEvent(data.reply);
    } else afterSpeaking();
    return;
  }
  // Driven entirely by the server's own response so this works the same
  // for typed and spoken messages -- for voice, the text isn't known
  // until transcription finishes server-side.
  if (data.transcribed_text) appendChatMessage("user", data.transcribed_text, "chat");
  if (data.reply) appendChatMessage("jarvis", data.reply, "chat");
  if (data.audio_base64) {
    setState("speaking");
    playAudio("data:" + data.audio_mime + ";base64," + data.audio_base64).then(afterSpeaking);
  } else {
    afterSpeaking();
  }
}

// ---- Voice recording (tap to start, tap again to stop and send) ----
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      sendAudio(blob);
    };
    mediaRecorder.start();
    isRecording = true;
    setState("recording");
  } catch (err) {
    showToast("Microphone access denied.");
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    if (currentTab === "pc") playClip("send");
  }
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function md(text) {        // the little bit of markdown the desktop panels use
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--cyan)">$1</a>');
}
function agoSecs(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 90) return "just now";
  if (sec < 5400) return Math.round(sec / 60) + " min ago";
  if (sec < 172800) return Math.round(sec / 3600) + " hours ago";
  return Math.round(sec / 86400) + " days ago";
}
function since(epoch) { return dash && epoch ? agoSecs(dash.now - epoch) : ""; }
function gbp(n) { return n == null ? "—" : (Number(n) < 0 ? "-£" : "£") + Math.abs(Number(n)).toFixed(2); }
function tile(k, v, n) { return `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ""}</div>`; }
function row(l, r) { return `<div class="row"><span class="l">${l}</span><span class="r">${r}</span></div>`; }

const RENDER = {

      + card("Money check, all four businesses", m.text
        ? `<div class="md">${md(m.text)}</div><p class="sub">Checked ${esc(since(m.at))}. Run a new check from the desktop Money tab.</p>`
        : '<p class="sub">Not checked yet. Run it from the desktop Money tab.</p>') + problem(m);
  },
  store(d) {
    const s = d.store || {}, products = s.products || [], o = s.orders || {}, list = o.orders || [], pay = o.payouts || {};
    const due = {};
    (pay.transactions || []).forEach((t) => { due[t.order] = t; });
    const orders = list.length
      ? list.map((r) => row(
          `<b>${esc(r.number)}</b> ${esc(r.customer)}<br><span class="sub">${esc(r.date)} · ${esc(r.items)}</span>`,
          `${esc(r.total)}<br><span class="sub">${esc(r.payment)} · ${esc(r.fulfilment || "not sent")}${due[r.number] ? `<br>${esc(due[r.number].net)} on ${esc(due[r.number].payout_date)}` : ""}</span>`)).join("")
      : `<p class="sub">${o.at ? "No orders yet." : "Not read yet."}</p>`;
    return `<div class="tiles">${tile("Orders", list.length || (o.ok ? "0" : "—"))}${tile("Pending payout", esc(pay.pending || "—"))}
        ${tile("Live products", products.length)}${tile("Christmas range", products.filter((p) => p.christmas).length)}</div>`
      + card("Orders", orders + (o.problem ? `<p class="sub">${esc(o.problem)}</p>` : "") + (o.at ? `<p class="sub">Read from Shopify ${esc(since(o.at))}.</p>` : ""))
      + card("Products", products.map((p) => row(
          `<a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--text)">${esc(p.title)}</a>${p.christmas ? ' <span class="sub">· Christmas</span>' : ""}`,
          p.price_min === p.price_max ? gbp(p.price_min) : gbp(p.price_min) + "–" + gbp(p.price_max))).join("")) + problem(s);
  },
  ads(d) {
    const t = (d.advertising || {}).tiktok || {}, posts = (d.posts || {}).posts || [];
    if (!t.ok) return card("TikTok", `<p class="sub">${esc(t.problem || "Not read yet.")}</p>`);
    const m = t.metrics || {};
    const ch = (x) => !x || x.change == null ? "" : `<span class="${x.change > 0 ? "good" : x.change < 0 ? "bad" : ""}">${x.change > 0 ? "▲" : x.change < 0 ? "▼" : "■"} ${Math.abs(x.change)}</span> vs week before`;
    const val = (k) => (m[k] || {}).value ?? "—";
    const vids = (t.videos || []).slice().sort((a, b) => (b.views || 0) - (a.views || 0));
    return `<div class="tiles">${tile("Video views (7d)", val("Video views"), ch(m["Video views"]))}${tile("Likes (7d)", val("Likes"), ch(m["Likes"]))}
        ${tile("Profile views", val("Profile views"), ch(m["Profile views"]))}${tile("Followers", t.followers ?? "—")}</div>`
      + card("Your videos", vids.map((v) => row(
          esc((v.caption || "").slice(0, 60)) + `<br><span class="sub">${esc(v.posted)}</span>`,
          `<b>${v.views ?? "—"}</b> views<br><span class="sub">${v.likes ?? 0} likes</span>`)).join("") + `<p class="sub">TikTok read ${esc(since(t.checked_at))}.</p>`)
      + (posts.length ? card("Ready to post", posts.map((p) => row(esc(p.title), esc(p.status))).join("") + '<p class="sub">Post them from the desktop Advertising tab.</p>') : "");
  },
  business(d) {
    const b = d.business || {};
    if (b.error) return problem(b);
    const bud = b.budget || {};
    return `<div class="tiles">${tile("Revenue", gbp(b.revenue))}${tile("Spent", gbp(b.cost))}${tile("Profit", `<span class="${(b.profit || 0) >= 0 ? "good" : "bad"}">${gbp(b.profit)}</span>`)}
        ${tile("Today", gbp(bud.spent_today), "of " + gbp(bud.daily_cap) + " a day")}</div>`
      + card("What Jarvis is running", (b.experiments || []).slice(0, 15).map((e) => row(esc(e.name) + `<br><span class="sub">${esc(e.type)}</span>`, esc(e.status))).join("") || '<p class="sub">Nothing yet.</p>')
      + card("What he's learned", (b.lessons || []).slice(0, 6).map((l) => `<p class="md" style="margin:0 0 8px">${esc(l.text)}</p>`).join("") || '<p class="sub">Nothing yet.</p>');
  },
  trading(d) {
    const t = d.trading || {};
    if (t.error) return problem(t);
    const pct = (x) => x == null ? "—" : (x * 100).toFixed(2) + "%";
    return card("Mode", `<p class="md">${esc(t.mode || "")}</p>`)
      + `<div class="tiles">${tile("Strategies tested", t.tested ?? "—")}${tile("Near misses", t.near_misses ?? "—")}</div>`
      + card("Forward trials (paper)", (t.forward || []).map((f) => row(
          esc(f.strategy) + `<br><span class="sub">${esc(f.status)} · day ${Math.floor(f.days_elapsed || 0)}</span>`,
          `<span class="${(f.pnl_pct || 0) >= 0 ? "good" : "bad"}">${pct(f.pnl_pct)}</span><br><span class="sub">${f.trades} trades</span>`)).join("") || '<p class="sub">None running.</p>')
      + card("Before any real money", (t.readiness || []).map((r) => row(`${r.ok ? '<span class="good">✔</span>' : '<span class="bad">✘</span>'} ${esc(r.detail)}`, "")).join(""));
  },
  usage(d) {
    const st = d.state || {}, w = (st.usage || {}).windows || {};
    const names = { five_hour: "5-hour session", seven_day: "Week (all models)" };
    const bars = Object.keys(w).map((k) => {
      const u = w[k].utilization, p = u == null ? null : (u <= 1 ? u * 100 : u);
      const resets = w[k].resets_at ? new Date(w[k].resets_at * 1000).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "";
      return `<div class="row" style="border:none;padding-bottom:0"><span class="l">${esc(names[k] || k.replace(/_/g, " "))}</span><span class="r">${p == null ? "—" : Math.round(p) + "% used"}${resets ? " · resets " + esc(resets) : ""}</span></div>
              <div class="bar ${p >= 85 ? "hot" : ""}"><div style="width:${Math.min(100, p || 0)}%"></div></div>`;
    }).join("");
    return card("Claude allowance", bars || '<p class="sub">Not measured yet.</p>') + card("Brains", `<p class="md">${esc(st.status_text || "")}</p>`);
  },
  needs(d) {
    const n = d.needs_you || {};
    return payCards(d) + jobCards(d) + card("Needs you", n.text ? `<div class="md">${md(n.text)}</div>` : '<p class="sub">Nothing needs you right now.</p>');
  },
};

// ---- Paying CJ: one tap = one order. The phone only passes the tap on; the PC checks it again and pays.
function payCards(d) {
  const p = d.cj_pay || {}, answered = (dash && dash.cj_pay_answered) || {}, now = dash ? dash.now : Date.now() / 1000;
  const offers = (p.offers || []).filter((o) => o.expires_at > now);
  const cards = offers.map((o) => {
    if (o.method === "handoff") {
      return `<div class="card pay-card"><h3>Pay CJ for an order</h3><div class="md">${esc(o.summary)}</div>
        <p class="sub">Checked and ready. CJ needs your card's security code, so you pay this one: open CJ (if it shows the order list, find ${esc(o.shop_order)} and press its pay button), choose your saved card, type the code, tick the terms box, press PAY. Jarvis checks it went through.</p>
        <div class="pay-btns"><a class="go" style="flex:1;text-align:center;padding:11px 0;border-radius:10px;background:#1f9d5c;color:#fff;font-weight:600;text-decoration:none"
          href="${esc(o.pay_url)}" target="_blank" rel="noopener">Open CJ to pay $${Number(o.amount_usd).toFixed(2)}</a></div></div>`;
    }
    const a = answered[String(o.id)];
    const btns = a
      ? `<p class="sub">${a.action === "pay" ? "Pay sent to your PC. Jarvis will say when it's done." : "You said not now."}</p>`
      : `<div class="pay-btns"><button class="go" data-pay="${o.id}" data-act="pay">Pay $${Number(o.amount_usd).toFixed(2)}</button>
         <button data-pay="${o.id}" data-act="reject">Not now</button></div>`;
    return `<div class="card pay-card"><h3>Pay CJ for an order</h3><div class="md">${esc(o.summary)}</div>
      <p class="sub">Paid from your CJ wallet: Jarvis presses Pay on CJ for this one order. Expires in ${Math.max(1, Math.round((o.expires_at - now) / 60))} min.</p>${btns}</div>`;
  });
  const day = now - 86400, words = { paid: "paid ✔", failed: "didn't go through", needs_danny: "needs you on CJ", unclear: "check it on CJ",
    blocked: "not paid", approved: "paying…", paying: "paying…" };
  const recent = (p.recent || []).filter((r) => words[r.status] && (r.decided_at || r.finished_at || 0) > day).slice(0, 3);
  const done = recent.length ? card("CJ payments today", recent.map((r) => row(`<b>${esc(r.shop_order)}</b> $${Number(r.amount_usd).toFixed(2)}`
      + (r.result ? `<br><span class="sub">${esc(r.result)}</span>` : ""), esc(words[r.status]))).join("")) : "";
  return cards.join("") + done;
}
// ---- Jarvis's "do it" jobs: read-only here. Questions are answered only with the buttons in the Jarvis window on the PC.
function askLine(a) {
  return `<b>Job ${esc(a.run_id)} ${a.kind === "hand" ? "needs you to" : "asks to"}:</b> ${esc(a.what)}`;
}
function jobCards(d) {
  const j = d.jobs || {};
  if (j.error) return card("Jarvis's jobs", problem(j));
  const asks = j.waiting_for_you || [], jobs = j.jobs || [];
  const waiting = asks.length ? `<div class="card ask-card"><h3>Jobs waiting for you</h3>` + asks.map((a) => `<div class="row"><span class="l">${askLine(a)}`
      + (a.why ? `<br><span class="sub">${esc(a.why)}</span>` : "") + `</span><span class="r sub">${esc(since(a.created_at))}</span></div>`).join("")
      + `<p class="sub">Answer it with the buttons in the Jarvis window on your PC.</p></div>` : "";
  if (!jobs.length) return waiting;
  const words = { queued: "queued", running: "working…", waiting_for_claude: "paused (Claude allowance)", succeeded: "done ✔",
    failed: "failed", timed_out: "timed out", cancelled: "stopped" };
  const asking = new Set(asks.map((a) => String(a.run_id)));
  const cost = (c) => c == null ? "" : ` · $${Number(c).toFixed(2)}`;
  return waiting + card("Jarvis's jobs", jobs.map((x) => row(
      `<b>Job ${esc(x.id)}</b> ${esc(x.title)}<br><span class="sub">${esc(since(x.finished_at || x.started_at || x.created_at))}${cost(x.cost_usd)}</span>`,
      asking.has(String(x.id)) ? '<span class="bad">waiting for you</span>'
        : `<span class="${x.status === "succeeded" ? "good" : ["failed", "timed_out"].includes(x.status) ? "bad" : ""}">${esc(words[x.status] || x.status)}</span>`)).join(""));
}
infoBody.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-pay]");
  if (!b) return;
  const offers = (((dash || {}).dashboard || {}).cj_pay || {}).offers || [];
  const o = offers.find((x) => String(x.id) === b.dataset.pay);
  if (!o) return;
  if (b.dataset.act === "pay" && !confirm(`Pay CJ $${Number(o.amount_usd).toFixed(2)} for order ${o.shop_order}?`)) return;
  b.parentElement.querySelectorAll("button").forEach((x) => { x.disabled = true; });
  try {
    const res = await fetch("/api/cj_pay/answer", { method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getSecret() },
      body: JSON.stringify({ id: o.id, nonce: o.nonce, amount_usd: o.amount_usd, action: b.dataset.act }) });
    const r = await res.json();
    showToast(r.text || r.error || "Sent.");
  } catch (err) {
    showToast("Couldn't reach the phone server. Try again.");
  }
  renderInfo();
});

async function renderInfo() {
  if (!INFO_TABS.includes(currentTab)) return;
  try {
    const res = await fetch("/api/dashboard", { headers: { "Authorization": "Bearer " + getSecret() } });
    dash = await res.json();
  } catch (err) {
    infoHead.textContent = "Couldn't reach Jarvis's phone server.";
    return;
  }
  const d = dash.dashboard;
  if (!d) {
    infoHead.textContent = "";
    infoBody.innerHTML = card("Not here yet", "<p class=\"sub\">The PC hasn't sent its dashboard yet. It sends it every few minutes while the Jarvis window is open on the PC.</p>");
    return;
  }
  infoHead.textContent = `Updated ${since(dash.at)}` + (dash.pc_online ? "" : " · PC is off, showing the last copy");
  try {
    infoBody.innerHTML = RENDER[currentTab](d);
  } catch (err) {
    infoBody.innerHTML = card("Oops", `<p class="sub">Couldn't show this tab: ${esc(err.message)}</p>`);
  }
}
setInterval(() => { if (INFO_TABS.includes(currentTab)) renderInfo(); }, 60000);
</script>
